server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # IMPORTANTE: sem barra no final do proxy_pass.
    # Com barra ("http://backend:8081/") o nginx remove o prefixo /api
    # e o back-end (que mapeia /api/centros) responderia 404.
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HTML, CSS e JS: o navegador sempre confere se há versão nova (ETag),
    # então uma atualização do site aparece sem precisar limpar o cache.
    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        try_files $uri $uri/ /index.html;
    }
}
