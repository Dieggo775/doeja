<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoeJá - Encontre centros de doação próximos</title>

    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&f[]=boska@500,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"
            integrity="sha384-hJnF5AwidE18GSWTAGHv3ByzzvfNZ1Tcx5y1UUV3WkauuMCEzBJBMSwSt/PUPXnM"
            crossorigin="anonymous"></script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/extras.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <svg class="logo" viewBox="0 0 48 48" aria-label="DoeJá">
                <circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="3"/>
                <path d="M18 18 L24 24 L30 18" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
                <circle cx="24" cy="24" r="4" fill="currentColor"/>
            </svg>

            <h1 class="logo-text">Doe<span class="accent">Já</span></h1>

            <div class="header-actions">
                <button class="theme-toggle" data-theme-toggle aria-label="Alternar tema">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/>
                        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main class="main">
        <section class="hero">
            <div class="container">
                <h2 class="hero-title">Encontre centros de doação próximos a você</h2>
                <p class="hero-subtitle">Roupas, alimentos, higiene. Faça a diferença onde mais importa.</p>

                <div class="search-section">
                    <div class="search-inputs">
                        <input type="text" id="searchLocation" placeholder="Digite seu bairro ou CEP" class="search-input">
                        <button class="search-btn" id="searchBtn">
                            <i data-lucide="search"></i>
                            Buscar
                        </button>
                    </div>

                    <div class="location-row">
                        <button class="clear-btn" id="useLocationBtn" type="button">
                            <i data-lucide="locate-fixed"></i>
                            Usar minha localização
                        </button>
                    </div>
                    <p class="search-notice" id="searchNotice" role="status" hidden></p>
                </div>
            </div>
        </section>

        <section class="filters-section">
            <div class="container">
                <div class="filters">
                    <select id="cidadeFilter" class="filter-select">
                        <option value="">Todas as cidades</option>
                    </select>

                    <select id="bairroFilter" class="filter-select">
                        <option value="">Todos os bairros</option>
                    </select>

                    <select id="ativoFilter" class="filter-select">
                        <option value="">Todos os status</option>
                        <option value="true">Ativos</option>
                        <option value="false">Inativos</option>
                    </select>

                    <button class="filter-btn" id="applyFilters">Filtrar</button>
                    <button class="clear-btn" id="clearFilters">Limpar</button>
                </div>
            </div>
        </section>

        <section class="map-section">
            <div class="container">
                <div class="map-container" id="map"></div>
            </div>
        </section>

        <section class="centros-section">
            <div class="container">
                <div class="section-header">
                    <h3 class="section-title">Centros próximos</h3>
                    <div class="pagination" id="pagination"></div>
                </div>

                <div class="centros-grid" id="centrosGrid"></div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 DoeJá - Transformando solidariedade em ação. ODS 1 - Erradicação da Pobreza</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
