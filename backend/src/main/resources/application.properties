spring.application.name=doeja
server.port=8081

# Valores reais vêm do docker-compose (variáveis SPRING_DATASOURCE_*).
# Os padrões abaixo servem só para rodar fora do Docker.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/doeja}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:doeja}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ATENÇÃO: create-drop apaga e recria as tabelas a cada reinício.
# Será substituído por Flyway (migrations) na próxima etapa.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always
# Sem isso, acentos do data.sql podem quebrar dentro do container
spring.sql.init.encoding=UTF-8

# Expõe apenas o health check
management.endpoints.web.exposure.include=health
