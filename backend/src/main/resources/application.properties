spring.application.name=doeja
server.port=8081

# Valores reais vêm do docker-compose (variáveis SPRING_DATASOURCE_*).
# Os padrões abaixo servem só para rodar fora do Docker.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/doeja}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:doeja}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# O Flyway cria e atualiza o banco (pasta db/migration).
# O Hibernate apenas CONFERE se as entidades batem com as tabelas (validate).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
# Em produção só db/migration. Dados de exemplo (db/seed) entram via
# SPRING_FLYWAY_LOCATIONS no docker-compose do ambiente de desenvolvimento.
spring.flyway.locations=classpath:db/migration

# Expõe apenas o health check
management.endpoints.web.exposure.include=health
