spring.application.name=doeja
# Render/Heroku informam a porta em PORT; no Docker local fica 8081
server.port=${PORT:8081}

# Valores reais vêm do docker-compose (variáveis SPRING_DATASOURCE_*).
# Os padrões abaixo servem só para rodar fora do Docker.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/doeja}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:doeja}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Em nuvem também dá para usar DATABASE_URL=postgresql://... (ver DatabaseUrlEnvironmentPostProcessor)
# Poucas conexões: bancos gratuitos (Neon) têm limite baixo
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}

# O Flyway cria e atualiza o banco (pasta db/migration).
# O Hibernate apenas CONFERE se as entidades batem com as tabelas (validate).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
# Em produção só db/migration. Dados de exemplo (db/seed) entram via
# SPRING_FLYWAY_LOCATIONS no docker-compose do ambiente de desenvolvimento.
spring.flyway.locations=classpath:db/migration

# Expõe apenas o health check
management.endpoints.web.exposure.include=health

# Limita o tamanho máximo de página da API
spring.data.web.pageable.max-page-size=50

# ---------------------------------------------------------------
# Segurança e contas iniciais (valores vêm do .env via docker-compose)
# ---------------------------------------------------------------
# Chave para assinar os tokens de login (mínimo 32 caracteres).
doeja.jwt.secret=${JWT_SECRET:}
doeja.jwt.validade-horas=8

# Administrador criado na primeira subida (se ainda não existir)
doeja.admin.email=${ADMIN_EMAIL:}
doeja.admin.senha=${ADMIN_SENHA:}

# Modo demonstração: mostra o aviso de "instituições fictícias" e cria as contas de teste
doeja.demo.enabled=${DEMO_ENABLED:false}
doeja.demo.senha=${DEMO_SENHA:}

# Não abre transação de banco durante a renderização da resposta
spring.jpa.open-in-view=false
